name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e tipagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pydantic,django]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formatação)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  testes:
    name: Testes (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Testes com cobertura (núcleo, sem extras)
        run: pytest --cov

  integracoes:
    name: Integrações Pydantic e Django (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pydantic,django]"
      - name: Testes
        run: pytest -rs tests/test_contrib_pydantic.py tests/test_contrib_django.py cpf_alfacnpj/contrib

  pacote:
    name: Build e instalação do pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Conferir conteúdo do wheel
        run: |
          python -m zipfile -l dist/*.whl
          if python -m zipfile -l dist/*.whl | grep -E '(^| )tests/|\.pdf'; then
            echo "O wheel não deve conter tests/ nem o PDF" && exit 1
          fi
      - name: Instalar o wheel num ambiente limpo
        run: |
          python -m venv /tmp/limpo
          /tmp/limpo/bin/pip install dist/*.whl
          /tmp/limpo/bin/cpf-alfacnpj --version
          /tmp/limpo/bin/cpf-alfacnpj validar 12.ABC.345/01DE-35 111.444.777-35
          /tmp/limpo/bin/python -c "import cpf_alfacnpj; print(cpf_alfacnpj.__version__)"
